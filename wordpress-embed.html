<!-- WordPress > Özel HTML bloğuna ekle.
     GitHub Pages Settings üzerinden main / root olarak etkinleştirildikten sonra bu adres çalışır.
     GitHub Pages etkinleşene kadar URL erişilebilir olmayabilir. -->
<div style="max-width:1080px;margin:0 auto">
  <iframe
    id="wolkanca-ai-quiz"
    title="Gerçek mi, Yapay Zekâ mı? — Wolkanca mini oyun"
    src="https://wolkanca.github.io/ai-or-real-quiz/"
    width="100%"
    height="940"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-write"
    style="display:block;width:100%;min-height:740px;border:0;border-radius:16px;background:#090e1c"
  ></iframe>
</div>
<script>
// İsteğe bağlı: iframe yüksekliğini içeriğe göre ayarlar.
// WordPress kullanıcısı script ekleyemiyorsa bu kısmı silebilir; sabit yükseklik yine çalışır.
(() => {
  const frame = document.getElementById('wolkanca-ai-quiz');
  if (!frame) return;
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;
    if (event.origin !== new URL(frame.src).origin) return;
    if (event.data?.type !== 'wolkanca-quiz:height') return;
    const h = Number(event.data.height);
    if (Number.isFinite(h) && h >= 400 && h <= 2200) {
      frame.style.height = Math.ceil(h + 8) + 'px';
    }
  });
})();
</script>
